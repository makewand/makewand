<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="wandGrad" x1="10" y1="90" x2="80" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background circle subtle -->
  <circle cx="50" cy="50" r="46" fill="#0f172a" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Orbit rings -->
  <circle cx="68" cy="32" r="18" stroke="#8b5cf6" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.4"/>
  <circle cx="68" cy="32" r="26" stroke="#3b82f6" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>
  
  <!-- Wand body -->
  <line x1="22" y1="78" x2="62" y2="38" stroke="url(#wandGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
  <line x1="22" y1="78" x2="36" y2="64" stroke="#e2e8f0" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <line x1="22" y1="78" x2="26" y2="74" stroke="#f8fafc" stroke-width="8" stroke-linecap="round"/>

  <!-- Wand tip burst -->
  <circle cx="64" cy="36" r="3.5" fill="#f8fafc" filter="url(#glow)"/>

  <!-- Multi-model constellation star nodes -->
  <!-- Top Node: Claude / Anthropic (Amber) -->
  <circle cx="68" cy="12" r="3.5" fill="#f59e0b" filter="url(#glow)"/>
  <line x1="64" y1="36" x2="68" y2="12" stroke="#f59e0b" stroke-width="1" opacity="0.6"/>

  <!-- Right Node: Codex / OpenAI (Green) -->
  <circle cx="88" cy="32" r="3.5" fill="#10b981" filter="url(#glow)"/>
  <line x1="64" y1="36" x2="88" y2="32" stroke="#10b981" stroke-width="1" opacity="0.6"/>

  <!-- Diagonal Node: Antigravity / Gemini (Cyan) -->
  <circle cx="78" cy="52" r="3.5" fill="#06b6d4" filter="url(#glow)"/>
  <line x1="64" y1="36" x2="78" y2="52" stroke="#06b6d4" stroke-width="1" opacity="0.6"/>

  <!-- Upper-Left Node: Grok (Violet) -->
  <circle cx="48" cy="22" r="3" fill="#a855f7" filter="url(#glow)"/>
  <line x1="64" y1="36" x2="48" y2="22" stroke="#a855f7" stroke-width="1" opacity="0.6"/>

  <!-- Sparkles -->
  <polygon points="68,26 70,31 75,32 70,34 68,39 66,34 61,32 66,31" fill="#ffffff" opacity="0.9"/>
  <polygon points="40,46 41,49 44,50 41,51 40,54 39,51 36,50 39,49" fill="#38bdf8" opacity="0.7"/>
</svg>
