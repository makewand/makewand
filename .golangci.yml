version: "2"
linters:
  # errcheck, govet, ineffassign, staticcheck, and unused are enabled by default
  # in golangci-lint v2; gocritic and gosec are added on top (matching the prior
  # v1 config's intent).
  enable:
    - gocritic
    - gosec
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
formatters:
  exclusions:
    generated: lax
