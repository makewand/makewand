version: "2"
linters:
  # errcheck, govet, ineffassign, staticcheck, and unused are enabled by default
  # in golangci-lint v2; gocritic and gosec are added on top (matching the prior
  # v1 config's intent).
  enable:
    - gocritic
    - gosec
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    # Only paths that exist in this repository. `benchmarks` holds the tracked
    # benchmark harness plus locally generated (gitignored) result projects.
    # Stale entries for local scratch projects (notes-api, blog-project, ...)
    # and the golangci-lint template defaults (third_party, builtin, examples)
    # were removed: none of them exist here, so they only hid future code.
    paths:
      - benchmarks
formatters:
  exclusions:
    generated: lax
