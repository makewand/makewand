name: Deploy site

# Publishes site/ to the Cloudflare Pages project "makewand" whenever it changes
# on master, and checks that every hostname it serves (makewand.org, makewand.com,
# their www. hosts and makewand.pages.dev) then serves the current install.sh.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Pages: Edit) and
# CLOUDFLARE_ACCOUNT_ID; without them the job only prints a notice.

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Skip without Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; the site was not deployed."
      - uses: actions/checkout@v7
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx --yes wrangler@4.148.0 pages deploy site --project-name=makewand --branch=master --commit-hash="$GITHUB_SHA"
      - name: Check the served installer
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        # One three-minute deadline for all hosts: they propagate together, and
        # retrying each host in turn could outlast the job's timeout.
        run: |
          pending="makewand.org www.makewand.org makewand.com www.makewand.com makewand.pages.dev"
          for attempt in $(seq 1 18); do
            stale=""
            for domain in $pending; do
              if curl -fsSL "https://$domain/install.sh" -o served.sh && cmp -s served.sh site/install.sh; then
                echo "$domain serves the current install.sh"
              else
                stale="$stale $domain"
              fi
            done
            pending="${stale# }"
            if [ -z "$pending" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::still serving a different install.sh three minutes after the deploy: $pending"
          exit 1
