name: Architecture runtime

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-windows:
    permissions:
      contents: read
    uses: ./.github/workflows/native-windows.yml

  load-and-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: HTTP load, persistent budget and hard process interruption
        run: go run ./cmd/server-drill --output build/server-drill.json --requests 400 --concurrency 32 --tenants 4 --router-calls 100000
      - name: Archive measured drill report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          archive: true
          name: server-drill-${{ github.sha }}
          path: build/server-drill.json
          if-no-files-found: error
