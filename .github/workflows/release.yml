name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    # CI's verify job (ci.yml) on the tag's commit: a tag that never passed CI
    # cannot skip a check a pull request must pass (gofmt, lint, shell syntax,
    # contracts, the trusted acceptance run...). On a tag, its version step
    # also requires the tag to equal "v" + makewand.__version__.
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Execute unpacked native release without checkout fallback
        shell: bash
        run: |
          python3 -m unittest discover -s tests -p test_filelock.py -v
          python3 -I scripts/test_installation.py InstallationTests.test_release_bundle_from_clean_extraction

  native-windows:
    permissions:
      contents: read
    uses: ./.github/workflows/native-windows.yml

  release:
    runs-on: ubuntu-latest
    needs: [test, package-smoke, native-windows]
    permissions:
      contents: write
      id-token: write
      attestations: write
    timeout-minutes: 30
    env:
      HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
      SCOOP_BUCKET_REPO: ${{ vars.SCOOP_BUCKET_REPO }}
      PACKAGE_REPO_TOKEN: ${{ secrets.PACKAGE_REPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          # Archives keep the tag in their names, but both engines report the bare
          # semantic version ("makewand version 3.2.0"), exactly like a source
          # install stamped from makewand.__version__ by scripts/install.sh.
          SEMVER="${VERSION#v}"
          mkdir -p dist

          build_one() {
            local goos="$1"
            local goarch="$2"
            local ext=""
            if [ "$goos" = "windows" ]; then
              ext=".exe"
            fi

            local bin="makewand${ext}"
            local base="makewand_${VERSION}_${goos}_${goarch}"
            local outdir="dist/${base}"
            mkdir -p "${outdir}"

            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go build -trimpath -ldflags "-s -w -X github.com/makewand/makewand/internal/buildinfo.Version=${SEMVER} -X github.com/makewand/makewand/internal/buildinfo.Commit=${GITHUB_SHA:0:7}" \
              -o "${outdir}/${bin}" ./cmd/makewand

            python3 -I scripts/stage_python_engine.py "${outdir}" "${SEMVER}"

            if [ "$goos" = "windows" ]; then
              (cd dist && zip -q -r "${base}.zip" "${base}")
            else
              (cd dist && tar -czf "${base}.tar.gz" "${base}")
            fi
          }

          build_one linux amd64
          build_one linux arm64
          build_one darwin amd64
          build_one darwin arm64
          build_one windows amd64

          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

          # Fail the release if the built binary's version does not match the tag.
          # This guards against ldflags drift silently shipping a "dev" build
          # (the runner is linux/amd64, so verify that native artifact).
          bash scripts/release_contract.sh "dist/makewand_${VERSION}_linux_amd64/makewand" "${SEMVER}"

      - name: Generate Homebrew/Scoop manifests
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/gen_package_manifests.sh "${GITHUB_REF_NAME}" "${GITHUB_REPOSITORY}" dist/checksums.txt dist

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign checksums (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cosign sign-blob \
            --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt

      - name: Build release notes
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          BASE_URL="https://github.com/${REPO}/releases/download/${VERSION}"
          PREV_TAG="$(git tag --sort=-version:refname | grep '^v' | grep -Fxv "${VERSION}" | head -n 1 || true)"
          TAP_REPO="${HOMEBREW_TAP_REPO:-makewand/homebrew-makewand}"
          TAP_NAME="${TAP_REPO#*/}"
          TAP="${TAP_REPO%%/*}/${TAP_NAME#homebrew-}"
          BUCKET_REPO="${SCOOP_BUCKET_REPO:-makewand/scoop-makewand}"
          FENCE='```'

          {
            echo "## Highlights"
            if [ -n "${PREV_TAG}" ]; then
              git log --pretty='- %s (%h)' "${PREV_TAG}..${VERSION}" | sed -n '1,40p'
            else
              git log --pretty='- %s (%h)' -n 20 | sed -n '1,40p'
            fi
            echo
            echo "## Install (prebuilt, no Go toolchain required)"
            echo
            echo "Each archive contains the Go CLI and the matching Python engine (lib/); Python 3.9+ must be on PATH."
            echo "Keep the extracted directory together and put it (or a symlink to its makewand binary) on PATH."
            echo
            echo "${FENCE}bash"
            echo "# PLATFORM: linux_amd64 | linux_arm64 | darwin_amd64 | darwin_arm64"
            echo "PLATFORM=linux_amd64"
            echo "ARCHIVE=makewand_${VERSION}_\${PLATFORM}.tar.gz"
            echo "curl -fsSLO ${BASE_URL}/\${ARCHIVE}"
            echo "curl -fsSLO ${BASE_URL}/checksums.txt"
            echo "grep \" \${ARCHIVE}\$\" checksums.txt | sha256sum -c -   # macOS: shasum -a 256 -c -"
            echo "tar -xzf \"\${ARCHIVE}\""
            echo "./makewand_${VERSION}_\${PLATFORM}/makewand --version"
            echo "${FENCE}"
            echo
            echo "Windows: download makewand_${VERSION}_windows_amd64.zip and checksums.txt, verify the SHA-256, extract, and run makewand.exe."
            echo
            if [ -n "${PACKAGE_REPO_TOKEN:-}" ]; then
              echo "Package managers (updated by this release):"
              echo
              echo "${FENCE}bash"
              echo "brew install ${TAP}/makewand"
              echo "scoop bucket add makewand https://github.com/${BUCKET_REPO} && scoop install makewand"
              echo "${FENCE}"
              echo
            fi
            echo "Build from source instead (tracks master; needs the Go toolchain from go.mod and Python 3.9+):"
            echo
            echo "${FENCE}bash"
            echo "curl -fsSL https://makewand.org/install.sh | bash"
            echo "${FENCE}"
            echo
            echo "## Verify checksum signature (cosign keyless)"
            echo "${FENCE}bash"
            echo "cosign verify-blob \\"
            echo "  --certificate checksums.txt.pem \\"
            echo "  --signature checksums.txt.sig \\"
            echo "  --certificate-identity-regexp 'https://github.com/${REPO}/.github/workflows/release.yml@refs/tags/v[0-9]+\\.[0-9]+\\.[0-9]+' \\"
            echo "  --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \\"
            echo "  checksums.txt"
            echo "${FENCE}"
            echo
            if [ -n "${PREV_TAG}" ]; then
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${VERSION}"
            else
              echo "**Full Changelog**: https://github.com/${REPO}/commits/${VERSION}"
            fi
          } > dist/release-notes.md

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/checksums.txt.sig
            dist/checksums.txt.pem
            dist/homebrew/Formula/makewand.rb
            dist/scoop/makewand.json
          body_path: dist/release-notes.md
          fail_on_unmatched_files: true

      - name: Publish Homebrew tap (optional)
        if: ${{ env.PACKAGE_REPO_TOKEN != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ env.PACKAGE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          tap_repo="${HOMEBREW_TAP_REPO:-makewand/homebrew-makewand}"
          ./scripts/publish_homebrew_tap.sh "${tap_repo}" dist/homebrew/Formula/makewand.rb "${GITHUB_REF_NAME}"

      - name: Publish Scoop bucket (optional)
        if: ${{ env.PACKAGE_REPO_TOKEN != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ env.PACKAGE_REPO_TOKEN }}
        run: |
          set -euo pipefail
          bucket_repo="${SCOOP_BUCKET_REPO:-makewand/scoop-makewand}"
          ./scripts/publish_scoop_bucket.sh "${bucket_repo}" dist/scoop/makewand.json "${GITHUB_REF_NAME}"
