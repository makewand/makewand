name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A hung test must not hold a runner for the 6h default.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Open-source secret & sanitization scan
        shell: bash
        run: |
          ./scripts/check_secrets.sh

      - name: Secret scanner regression tests
        shell: bash
        run: bash scripts/test_check_secrets.sh

      - name: Version consistency
        shell: bash
        run: bash scripts/check_version.sh

      - name: Check shell script syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in scripts/*.sh site/install.sh dispatch/*.sh dispatch/ai-dispatch; do
            bash -n "${f}"
          done

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Shared command contract
        run: python3 -I scripts/generate_cli_contract.py --check

      - name: Shared execution contract
        run: python3 -I scripts/check_execution_contract.py

      - name: Install E2E dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          # bubblewrap so the live sandbox isolation test (verify_isolation_live_test.go)
          # actually runs instead of skipping — the generation/verification trust
          # boundary is security-critical and must be exercised end-to-end in CI.
          sudo apt-get install -y expect bubblewrap ripgrep
          rg --version

      - name: Allow unprivileged user namespaces for bubblewrap
        # Ubuntu 24.04 runners ship kernel.apparmor_restrict_unprivileged_userns=1:
        # an unconfined process may still create a user namespace, but AppArmor
        # moves it into the `unprivileged_userns` profile, which denies every
        # capability inside it. bwrap --unshare-net then cannot bring up loopback
        # (CAP_NET_ADMIN) and dies with "loopback: Failed RTM_NEWADDR: Operation
        # not permitted" -- the failure behind every CI/Release run since
        # 2026-07-19. Relax the restriction for this ephemeral runner only; `|| true`
        # keeps older images (no such sysctl) working, and the next step still
        # hard-fails if bwrap remains unusable.
        shell: bash
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Diagnose bubblewrap sandbox
        shell: bash
        run: |
          set -uo pipefail
          # First the minimal network-namespace check, then the exact probe the
          # product uses (internal/engine/verify_isolation.go).
          if out="$(bwrap --unshare-net --ro-bind / / true 2>&1)" \
            && out="$(bwrap --ro-bind / / --unshare-pid --unshare-net true 2>&1)"; then
            echo "bubblewrap OK: $(bwrap --version)"
            exit 0
          fi
          echo "::error title=bubblewrap sandbox unavailable::bwrap network-namespace probe failed: ${out}. The live sandbox gate (MAKEWAND_REQUIRE_BWRAP=1) cannot pass on this runner. 'Operation not permitted' on RTM_NEWADDR/loopback means unprivileged user namespaces are capability-restricted (AppArmor kernel.apparmor_restrict_unprivileged_userns=1)."
          echo "--- runner diagnostics ---"
          bwrap --version || true
          uname -a || true
          for k in kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone user.max_user_namespaces; do
            sysctl "$k" 2>/dev/null || echo "$k: (not present)"
          done
          exit 1

      - name: Check formatting (gofmt)
        shell: bash
        run: |
          set -euo pipefail
          gofiles="$(git ls-files '*.go')"
          if [ -z "${gofiles}" ]; then
            exit 0
          fi
          unformatted="$(gofmt -l ${gofiles})"
          if [ -n "${unformatted}" ]; then
            echo "The following files need gofmt:"
            echo "${unformatted}"
            exit 1
          fi

      - name: Live sandbox smoke (bubblewrap required, not cached)
        # The verification/generation trust boundary is security-critical, so the
        # real bwrap sandbox must be exercised on every run — not silently skipped
        # if bubblewrap is missing or broken. MAKEWAND_REQUIRE_BWRAP=1 turns an
        # unavailable sandbox into a hard failure; -count=1 defeats the test cache.
        env:
          MAKEWAND_REQUIRE_BWRAP: "1"
        run: go test ./internal/engine -run '^TestEvaluateCandidateFiles_LiveBwrapIsolation$' -count=1 -v

      - name: Run tests
        run: bash ./scripts/test_gate.sh

      - name: Independent trusted acceptance (real sandbox required)
        env:
          MAKEWAND_REQUIRE_BWRAP: "1"
        run: go test ./internal/engine -run 'TrustedAcceptance' -count=1 -v

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test dependencies
        run: pip install pytest

      - name: Run Python unit tests
        run: python3 -I scripts/test_python.py

      - name: Dispatch regression tests
        run: bash dispatch/test.sh

      - name: Offline benchmark harness
        run: |
          python3 -I benchmarks/test_runner.py
          python3 -I benchmarks/test_deep_config_acceptance_v4.py
          python3 -I benchmarks/test_analyze_results.py

      - name: Installer and unpacked release contract
        run: python3 -I scripts/test_installation.py

      - name: Run race tests
        # scripts/test_race.sh is the single source of truth for race
        # coverage; it derives its package list from `go list ./...` so the
        # concurrency-heavy router and server* packages are always included.
        run: bash ./scripts/test_race.sh

      - name: Run vet
        run: go vet ./...

      - name: Run govulncheck
        # Fail CI on any known vulnerability reachable from our code. The Go
        # toolchain is selected from go.mod (go-version-file above), so bumping
        # the `go` directive to a patched release is what clears stdlib CVEs.
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          # Pin the linter version so `latest` can't silently drift and break CI
          # again (a v2 bump against a v1 config is what wedged this pipeline).
          version: v2.12.2
          # Full-tree gate: the historical backlog was driven to zero, so lint the
          # whole codebase (not just changed lines) to keep it there. Flip back to
          # only-new-issues only if an intentional, tracked backlog is reintroduced.
          only-new-issues: false
          # Report all diagnostics, including repeated findings.
          args: --max-issues-per-linter=0 --max-same-issues=0
          # Skip action cache restore/save so each runner starts analysis fresh.
          skip-cache: true

      - name: Build CLI
        run: go build -trimpath -o build/makewand ./cmd/makewand

      - name: Print version
        run: ./build/makewand --version
