name: Windows weekly

# Nothing here runs on Windows day to day, so the gate no longer holds up every
# pull request. Release runs it through release.yml as well.
on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows:
    permissions:
      contents: read
    uses: ./.github/workflows/native-windows.yml
